<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Uudised</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="brand">
      <h1>Uudised</h1>
      <p class="tagline" id="tagline">The few stories worth your time.</p>
    </div>
    <nav class="tabs" aria-label="Views">
      <button type="button" id="tab-feed" class="tab" aria-pressed="true">Top 20</button>
      <button type="button" id="tab-history" class="tab" aria-pressed="false">History</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <p id="status" class="status" role="status"></p>

  <section id="view-feed" aria-labelledby="tab-feed">
    <ol id="feed" class="feed"></ol>
    <p id="feed-empty" class="empty" hidden>You're all caught up. New stories arrive with the next update.</p>
  </section>

  <section id="view-history" hidden>
    <div class="history-head">
      <h2>History</h2>
      <div class="seg" role="group" aria-label="Show">
        <button type="button" id="hist-read" aria-pressed="true">Read</button>
        <button type="button" id="hist-skipped" aria-pressed="false">Not interested</button>
      </div>
    </div>
    <ol id="history" class="feed compact"></ol>
    <p id="history-empty" class="empty" hidden>Nothing here yet.</p>
  </section>

</main>

<template id="card-tpl">
  <li class="card">
    <div class="rank" aria-hidden="true"></div>
    <div class="body">
      <div class="meta">
        <span class="topic"></span>
        <span class="region"></span>
        <span class="flag" hidden>Updated</span>
        <span class="followup" hidden>Follow-up</span>
      </div>
      <h3 class="title"><a target="_blank" rel="noopener noreferrer"></a></h3>
      <p class="why"></p>
      <p class="excerpt"></p>
      <ul class="links"></ul>
    </div>
    <div class="actions">
      <button type="button" class="btn act-read" title="Mark as read">✓ Read</button>
      <button type="button" class="btn ghost act-skip" title="Not interested: hide and learn from it">Not interested</button>
    </div>
  </li>
</template>

<script src="app.js"></script>
</body>
</html>
